name: Build Speed Run PRO

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Speed Run PRO APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      PROJECT_ZIP: Speed-Run-V7-PRO.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify the correct Speed Run source
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$GITHUB_WORKSPACE/$PROJECT_ZIP" ]; then
            echo "::error::Required source '$PROJECT_ZIP' was not found."
            echo "::error::This workflow will NOT fall back to V4/V5/V6."
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -printf '%f\n' | sort || true
            exit 1
          fi

          if grep -Rqs "Speed-Run-Firebase-Base-V4.zip" \
              "$GITHUB_WORKSPACE/.github/workflows" 2>/dev/null; then
            echo "::error::Old V4 workflow is still present. Remove/replace it."
            exit 1
          fi

          unzip -t "$GITHUB_WORKSPACE/$PROJECT_ZIP" >/dev/null

          echo "Correct source verified: $PROJECT_ZIP"

      - name: Extract exact source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/speedrun-project"

          mkdir -p "$GITHUB_WORKSPACE/speedrun-project"

          unzip -q "$GITHUB_WORKSPACE/$PROJECT_ZIP" \
            -d "$GITHUB_WORKSPACE/speedrun-project"

          SETTINGS_FILE="$(
            find "$GITHUB_WORKSPACE/speedrun-project" -type f \
              \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
              -not -path '*/.gradle/*' \
              -print -quit
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No Android Gradle project found inside $PROJECT_ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"

      - name: Validate Speed Run project
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/google-services.json"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/speedrun/delivery/MainActivity.kt"

          APP="$PROJECT_DIR/app/build.gradle.kts"
          MAIN="$PROJECT_DIR/app/src/main/java/com/speedrun/delivery/MainActivity.kt"
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          grep -q 'applicationId = "com.speedrun.delivery"' "$APP"
          grep -q 'namespace = "com.speedrun.delivery"' "$APP"
          grep -q 'compileSdk = 36' "$APP"
          grep -q 'package com.speedrun.delivery' "$MAIN"
          grep -q 'android:name=".MainActivity"' "$MANIFEST"

          if grep -Rqs 'Speed-Run-Firebase-Base-V4' "$PROJECT_DIR"; then
            echo "::error::Old V4 source detected. Refusing to build."
            exit 1
          fi

          echo "Speed Run source validation: PASSED"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          [ -x "$SDKMANAGER" ] || \
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"

          [ -x "$SDKMANAGER" ] || {
            echo "::error::Android sdkmanager not found."
            exit 1
          }

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Clean build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle clean --no-daemon

      - name: Build exact Speed Run source
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not produced."

            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          ls -lh "$APK"

          echo "APK verification: PASSED"

      - name: Upload Speed Run APK
        uses: actions/upload-artifact@v4
        with:
          name: speed-run-pro-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
