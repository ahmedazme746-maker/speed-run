name: Build Speed Run V7 PRO

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Speed Run V7 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      PROJECT_ZIP: Speed-Run-V7-PRO-COMPILE-FIXED.zip

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify V7 source
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Checking Speed Run V7 source"
          echo "======================================"

          if [ ! -f "$GITHUB_WORKSPACE/$PROJECT_ZIP" ]; then
            echo "::error::File '$PROJECT_ZIP' was not found."

            echo ""
            echo "ZIP files found:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 2 \
              -type f \
              -iname "*.zip" \
              -printf "%p\n" \
              | sort || true

            exit 1
          fi

          ls -lh "$GITHUB_WORKSPACE/$PROJECT_ZIP"

          unzip -t "$GITHUB_WORKSPACE/$PROJECT_ZIP" >/dev/null

          echo "V7 ZIP verified successfully."

      - name: Extract Speed Run V7
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/speedrun-project"

          mkdir -p "$GITHUB_WORKSPACE/speedrun-project"

          unzip -q \
            "$GITHUB_WORKSPACE/$PROJECT_ZIP" \
            -d "$GITHUB_WORKSPACE/speedrun-project"

          SETTINGS_FILE="$(
            find "$GITHUB_WORKSPACE/speedrun-project" \
              -type f \
              \( \
                -name "settings.gradle.kts" \
                -o \
                -name "settings.gradle" \
              \) \
              -not -path "*/.gradle/*" \
              -print \
              -quit
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No Gradle project found inside V7 ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

      - name: Validate Speed Run V7
        shell: bash
        run: |
          set -euo pipefail

          APP="$PROJECT_DIR/app/build.gradle.kts"
          MAIN="$PROJECT_DIR/app/src/main/java/com/speedrun/delivery/MainActivity.kt"
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          FIREBASE="$PROJECT_DIR/app/google-services.json"
          ROOT_BUILD="$PROJECT_DIR/build.gradle.kts"

          test -f "$ROOT_BUILD"
          test -f "$APP"
          test -f "$MAIN"
          test -f "$MANIFEST"
          test -f "$FIREBASE"

          grep -q \
            'applicationId = "com.speedrun.delivery"' \
            "$APP"

          grep -q \
            'namespace = "com.speedrun.delivery"' \
            "$APP"

          grep -q \
            'compileSdk = 36' \
            "$APP"

          grep -q \
            'package com.speedrun.delivery' \
            "$MAIN"

          grep -q \
            'android:name=".MainActivity"' \
            "$MANIFEST"

          grep -q \
            '"project_id": "speed-run-5ec7e"' \
            "$FIREBASE"

          echo "======================================"
          echo "SPEED RUN V7 VALIDATION PASSED"
          echo "======================================"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses \
            >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle clean --no-daemon

      - name: Build Speed Run V7
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "BUILDING SPEED RUN V7"
          echo "======================================"

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not generated."

            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -print \
              2>/dev/null || true

            exit 1
          fi

          echo "======================================"
          echo "APK CREATED SUCCESSFULLY"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload Speed Run V7 APK
        uses: actions/upload-artifact@v4
        with:
          name: speed-run-v7-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
