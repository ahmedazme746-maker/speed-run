name: Build Speed Run Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract Speed Run V4 ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 2 -type f -name 'Speed-Run-Firebase-Base-V4.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "Speed-Run-Firebase-Base-V4.zip not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          mkdir -p speedrun-project
          unzip -q "$ZIP_FILE" -d speedrun-project

      - name: Fix Android build configuration
        working-directory: speedrun-project
        shell: bash
        run: |
          set -e

          echo "Changing compileSdk 37 -> 36"
          sed -i 's/compileSdk = 37/compileSdk = 36/g' app/build.gradle.kts

          echo "Changing Compose BOM 2026.09.00 -> 2026.06.00"
          sed -i 's/compose-bom:2026.09.00/compose-bom:2026.06.00/g' app/build.gradle.kts

          echo "Final configuration:"
          grep -E 'compileSdk|compose-bom' app/build.gradle.kts

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        working-directory: speedrun-project
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: speed-run-debug-apk
          path: speedrun-project/app/build/outputs/apk/debug/app-debug.apk
