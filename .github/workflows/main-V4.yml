name: Build Speed Run V7 - Kotlin Fixed

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Speed Run V7
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      PROJECT_ZIP: Speed-Run-V7-PRO-KOTLIN-FIXED.zip

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify exact Speed Run source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/$PROJECT_ZIP"

          echo "======================================"
          echo "Checking Speed Run source"
          echo "======================================"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Required source '$PROJECT_ZIP' was not found."

            echo ""
            echo "ZIP files found:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -iname '*.zip' \
              -printf '%f\n' \
              | sort || true

            exit 1
          fi

          echo "Using:"
          echo "$PROJECT_ZIP"

          unzip -t "$ZIP" >/dev/null

          echo "ZIP integrity: OK"

      - name: Extract exact source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/speedrun-project"

          mkdir -p "$GITHUB_WORKSPACE/speedrun-project"

          unzip -q \
            "$GITHUB_WORKSPACE/$PROJECT_ZIP" \
            -d "$GITHUB_WORKSPACE/speedrun-project"

          SETTINGS_FILE="$(
            find "$GITHUB_WORKSPACE/speedrun-project" \
              -type f \
              \( \
                -name 'settings.gradle.kts' \
                -o \
                -name 'settings.gradle' \
              \) \
              -not -path '*/.gradle/*' \
              -print \
              -quit
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No Android Gradle project found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

      - name: Validate Speed Run project
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/google-services.json"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/speedrun/delivery/MainActivity.kt"

          APP="$PROJECT_DIR/app/build.gradle.kts"
          MAIN="$PROJECT_DIR/app/src/main/java/com/speedrun/delivery/MainActivity.kt"

          grep -q 'applicationId = "com.speedrun.delivery"' "$APP"
          grep -q 'namespace = "com.speedrun.delivery"' "$APP"
          grep -q 'compileSdk = 36' "$APP"
          grep -q 'package com.speedrun.delivery' "$MAIN"

          echo "Project validation: PASSED"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses \
            >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle clean \
            --no-daemon \
            --console=plain

      - name: Diagnose Kotlin compilation
        id: kotlin_compile
        continue-on-error: true
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail

          LOG="$GITHUB_WORKSPACE/kotlin-compile.log"

          echo "============================================" | tee "$LOG"
          echo " SPEED RUN - KOTLIN COMPILER DIAGNOSTIC" | tee -a "$LOG"
          echo "============================================" | tee -a "$LOG"

          gradle :app:compileDebugKotlin \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain \
            --warning-mode all \
            2>&1 | tee -a "$LOG"

          EXIT_CODE=${PIPESTATUS[0]}

          echo "" | tee -a "$LOG"
          echo "KOTLIN_EXIT_CODE=$EXIT_CODE" | tee -a "$LOG"

          exit "$EXIT_CODE"

      - name: Print actual Kotlin errors
        if: steps.kotlin_compile.outcome == 'failure'
        shell: bash
        run: |
          set +e

          echo ""
          echo "============================================"
          echo "           ACTUAL KOTLIN ERROR"
          echo "============================================"
          echo ""

          grep -nE \
            '(^e: |\.kt:[0-9]+:[0-9]+|Unresolved reference|Type mismatch|Expecting|Cannot find|Overload resolution ambiguity|None of the following functions|Argument type mismatch|Conflicting overloads|Syntax error)' \
            "$GITHUB_WORKSPACE/kotlin-compile.log" \
            | tail -n 150 || true

          echo ""
          echo "============================================"

      - name: Upload Kotlin diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speed-run-kotlin-diagnostic-log
          path: kotlin-compile.log
          if-no-files-found: warn

      - name: Stop if Kotlin compilation failed
        if: steps.kotlin_compile.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::Kotlin compilation failed."
          exit 1

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain \
            --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload Speed Run APK
        uses: actions/upload-artifact@v4
        with:
          name: speed-run-v7-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
