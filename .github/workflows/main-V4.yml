name: Build Speed Run V7 PRO

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Speed Run V7 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      PROJECT_ZIP: Speed-Run-V7-PRO.zip

    steps:

      # =========================================================
      # 1 - تحميل المستودع
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2 - Java 17
      # لا نستخدم Gradle cache هنا حتى لا يفشل قبل فك V7
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # 3 - التأكد أن ملف V7 موجود
      # =========================================================
      - name: Verify V7 source
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Checking Speed Run V7 source"
          echo "======================================"

          if [ ! -f "$GITHUB_WORKSPACE/$PROJECT_ZIP" ]; then
            echo "::error::File '$PROJECT_ZIP' was not found."

            echo ""
            echo "ZIP files found in repository:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 2 \
              -type f \
              -iname "*.zip" \
              -printf "%p\n" \
              | sort || true

            exit 1
          fi

          echo "Found:"
          ls -lh "$GITHUB_WORKSPACE/$PROJECT_ZIP"

          echo ""
          echo "Testing ZIP integrity..."

          unzip -t "$GITHUB_WORKSPACE/$PROJECT_ZIP" >/dev/null

          echo "ZIP integrity: OK"

      # =========================================================
      # 4 - فك V7
      # =========================================================
      - name: Extract Speed Run V7
        shell: bash
        run: |
          set -euo pipefail

          echo "Extracting Speed Run V7..."

          rm -rf "$GITHUB_WORKSPACE/speedrun-project"

          mkdir -p "$GITHUB_WORKSPACE/speedrun-project"

          unzip -q \
            "$GITHUB_WORKSPACE/$PROJECT_ZIP" \
            -d "$GITHUB_WORKSPACE/speedrun-project"

          echo ""
          echo "Searching for Gradle project..."

          SETTINGS_FILE="$(
            find "$GITHUB_WORKSPACE/speedrun-project" \
              -type f \
              \( \
                -name "settings.gradle.kts" \
                -o \
                -name "settings.gradle" \
              \) \
              -not -path "*/.gradle/*" \
              -print \
              -quit
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No Gradle Android project was found inside V7 ZIP."

            echo ""
            echo "Extracted files:"
            find "$GITHUB_WORKSPACE/speedrun-project" \
              -maxdepth 4 \
              -type f \
              | sort \
              | head -200 || true

            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "V7 project found at:"
          echo "$PROJECT_DIR"

      # =========================================================
      # 5 - فحص ملفات المشروع
      # =========================================================
      - name: Validate Speed Run V7
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Validating Speed Run V7"
          echo "======================================"

          APP="$PROJECT_DIR/app/build.gradle.kts"
          MAIN="$PROJECT_DIR/app/src/main/java/com/speedrun/delivery/MainActivity.kt"
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          FIREBASE="$PROJECT_DIR/app/google-services.json"
          ROOT_BUILD="$PROJECT_DIR/build.gradle.kts"

          echo "Checking required files..."

          test -f "$ROOT_BUILD" || {
            echo "::error::Root build.gradle.kts is missing."
            exit 1
          }

          test -f "$APP" || {
            echo "::error::app/build.gradle.kts is missing."
            exit 1
          }

          test -f "$MAIN" || {
            echo "::error::MainActivity.kt is missing."
            exit 1
          }

          test -f "$MANIFEST" || {
            echo "::error::AndroidManifest.xml is missing."
            exit 1
          }

          test -f "$FIREBASE" || {
            echo "::error::google-services.json is missing."
            exit 1
          }

          echo "Required files: OK"

          echo ""
          echo "Checking application ID..."

          grep -q \
            'applicationId = "com.speedrun.delivery"' \
            "$APP" || {
              echo "::error::Wrong applicationId."
              exit 1
            }

          echo "applicationId: OK"

          echo ""
          echo "Checking namespace..."

          grep -q \
            'namespace = "com.speedrun.delivery"' \
            "$APP" || {
              echo "::error::Wrong namespace."
              exit 1
            }

          echo "namespace: OK"

          echo ""
          echo "Checking compile SDK..."

          grep -q \
            'compileSdk = 36' \
            "$APP" || {
              echo "::error::compileSdk 36 was not found."
              exit 1
            }

          echo "compileSdk 36: OK"

          echo ""
          echo "Checking MainActivity package..."

          grep -q \
            'package com.speedrun.delivery' \
            "$MAIN" || {
              echo "::error::Wrong MainActivity package."
              exit 1
            }

          echo "MainActivity package: OK"

          echo ""
          echo "Checking MainActivity manifest..."

          grep -q \
            'android:name=".MainActivity"' \
            "$MANIFEST" || {
              echo "::error::MainActivity was not found in manifest."
              exit 1
            }

          echo "Manifest MainActivity: OK"

          echo ""
          echo "Checking Firebase project..."

          grep -q \
            '"project_id": "speed-run-5ec7e"' \
            "$FIREBASE" || {
              echo "::error::Wrong Firebase project."
              exit 1
            }

          echo "Firebase project: OK"

          echo ""
          echo "Checking for forbidden old V4 source..."

          if grep -Rqs \
            "Speed-Run-Firebase-Base-V4" \
            "$PROJECT_DIR" \
            --exclude-dir=.gradle \
            --exclude-dir=build; then

            echo "::error::Old V4 source detected."
            echo "::error::Build stopped to prevent building the wrong version."
            exit 1
          fi

          echo "Old V4 source: NOT FOUND"

          echo ""
          echo "======================================"
          echo "V7 VALIDATION PASSED"
          echo "======================================"

      # =========================================================
      # 6 - Android SDK 36
      # =========================================================
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing Android SDK 36..."

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses \
            >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "Android SDK 36: OK"

      # =========================================================
      # 7 - Gradle 8.13
      # =========================================================
      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # =========================================================
      # 8 - تنظيف المشروع
      # =========================================================
      - name: Clean V7 project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Cleaning project..."

          gradle clean --no-daemon

          echo "Clean: OK"

      # =========================================================
      # 9 - بناء V7
      # =========================================================
      - name: Build Speed Run V7
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "BUILDING SPEED RUN V7"
          echo "======================================"

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "BUILD FINISHED"

      # =========================================================
      # 10 - التأكد أن APK اتعمل
      # =========================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking APK..."

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not generated."

            echo ""
            echo "Available output files:"

            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -print \
              2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "======================================"
          echo "APK CREATED SUCCESSFULLY"
          echo "======================================"

          ls -lh "$APK"

      # =========================================================
      # 11 - رفع APK كـ Artifact
      # =========================================================
      - name: Upload Speed Run V7 APK
        uses: actions/upload-artifact@v4
        with:
          name: speed-run-v7-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
