name: Build Speed Run Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract Speed Run ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 2 -type f -name 'Speed-Run-Firebase-Base-V3.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Speed-Run-Firebase-Base-V3.zip not found"
            exit 1
          fi
          echo "Using: $ZIP_FILE"
          mkdir -p speedrun-project
          unzip -q "$ZIP_FILE" -d speedrun-project
          echo "Extracted project:"
          find speedrun-project -maxdepth 3 -type f | head -80

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Debug APK
        working-directory: speedrun-project
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: speed-run-debug-apk
          path: speedrun-project/app/build/outputs/apk/debug/app-debug.apk
